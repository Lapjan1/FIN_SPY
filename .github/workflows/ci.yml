name: CI - FIN_SPY
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Setup Python deps
        run: uv sync --dev || pip install -e .[dev] || pip install pytest fastapi pydantic PyMuPDF pdfplumber openpyxl XlsxWriter reportlab pyHanko
      - name: Lint
        run: uv run ruff check . || echo "ruff not installed, skip"
      - name: Type check
        run: uv run pyright || echo "pyright skip"
      - name: Tests - smoke
        run: uv run pytest -q || pytest -q
      - name: Secret scan - gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Golden tests (synthetic)
        run: uv run pytest tests/golden -v || echo "golden pending"
      - name: RLS isolation test placeholder
        run: echo "TODO: cross-tenant read should fail"
      - name: Verify no FINSPIB import
        run: |
          if grep -R "from FINSPIB\|import FINSPIB\|from FNBP\|import FNBP" apps/ --include="*.py"; then
            echo "FAIL: FINSPIB/FNBP import banned per AGENTS.md for hackathon compliance"
            exit 1
          fi
          echo "OK no banned imports"
