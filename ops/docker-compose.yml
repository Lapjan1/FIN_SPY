# For local full stack - optional, MVP uses SQLite local files per AGENTS.md
# Railway handles prod deploy per homework Part 5.14
version: "3.8"
services:
  api:
    build: ../apps/api
    ports:
      - "8000:8000"
    env_file: ../.env
    volumes:
      - ../data:/data
  worker:
    build: ../apps/worker
    env_file: ../.env
    volumes:
      - ../data:/data
    depends_on:
      - api
  web:
    build: ../apps/web
    ports:
      - "3000:3000"
    env_file: ../.env
