# For local full stack - optional, MVP uses SQLite local files per AGENTS.md
# Railway handles prod deploy per homework Part 5.14 (healthcheck /health/ready)
# Unified dsh-local project C:\Users\dshan\Downloads\Projects\DeepSH\local-stack\docker-compose.yml owns freellmapi, 9router, books-db external volumes
version: "3.8"
services:
  api:
    build: ../apps/api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ../.env
    volumes:
      - ../data:/data
      - ../logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    build: ../apps/worker
    env_file: ../.env
    volumes:
      - ../data:/data
      - ../logs:/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ../.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
