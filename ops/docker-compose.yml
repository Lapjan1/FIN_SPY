# For local full stack - optional, MVP uses SQLite local files per AGENTS.md
# Railway handles prod deploy per homework Part 5.14 (healthcheck /health/ready)
# Unified dsh-local project C:\Users\dshan\Downloads\Projects\DeepSH\local-stack\docker-compose.yml owns freellmapi, 9router, books-db external volumes
# Local deploy: docker compose -f ops/docker-compose.yml up --build -d (from repo root)
# Requires .env (see .env.example): DATABASE_PATH=/data/fin_spy.db, VAULT_PATH=/data/vault, WORKER_ENABLED=true
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ../.env
    volumes:
      - ../data:/data
      - ../logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  # No separate worker service locally: apps/worker has no Dockerfile and two
  # containers on one SQLite file risks lock contention. WORKER_ENABLED=true
  # runs the proven in-process worker thread (same mode as Railway FIN_SPY).
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ../.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
