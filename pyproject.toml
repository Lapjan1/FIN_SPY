[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-spy"
version = "0.1.0"
description = "FIN_SPY Financial Surveillance & Peak Insights - forensic books + spy + KPI + debt strategies, Meta hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "openai>=1.0",
  "python-dotenv>=1.0",
  "PyMuPDF>=1.24",
  "pdfplumber>=0.10",
  "openpyxl>=3.1",
  "XlsxWriter>=3.2",
  "reportlab>=4.0",
  "pyHanko>=0.20",
  "cryptography>=42",
  "pillow>=10",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pyright>=1.15",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E","F","W","C90"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
